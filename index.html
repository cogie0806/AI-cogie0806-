<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>AI/cogie0806</title>
  
  <link rel="icon" href="cogie0806.jpg" type="image/jpeg">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: sans-serif;
      background-color: #ffffff;
      margin: 0;
      padding: 0;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* 左側のサイドメニュー */
    #sidebar {
      width: 260px;
      background-color: #f9f9f9;
      border-right: 1px solid #e0e0e0;
      display: flex;
      flex-direction: column;
      padding: 15px;
      gap: 10px;
    }

    /* 新規チャットボタン */
    .new-chat-btn {
      background-color: #333;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    /* 履歴検索入力欄 */
    .search-box input {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
    }

    /* 履歴リストエリア */
    #history-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .history-item {
      padding: 10px;
      background-color: #fff;
      border: 1px solid #eee;
      border-radius: 6px;
      font-size: 13px;
      color: #333;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      cursor: pointer;
    }

    .history-item:hover {
      background-color: #e6f7ff;
      border-color: #91d5ff;
    }

    /* 履歴削除ボタン */
    .clear-history-btn {
      background-color: #ff4d4f;
      color: white;
      border: none;
      padding: 8px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
    }

    /* 右側のメインチャットエリア */
    #main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100vh;
      padding: 20px;
    }

    #chat-box {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .user {
      align-self: flex-end;
      background-color: #f0f0f0;
      color: #333;
      padding: 10px 20px;
      border-radius: 20px;
      max-width: 60%;
    }

    .ai-wrapper {
      align-self: flex-start;
      max-width: 80%;
    }

    .ai {
      color: #333;
      padding: 5px 0;
      line-height: 1.6;
    }

    .action-buttons {
      display: flex;
      gap: 8px;
      margin-top: 5px;
    }

    .action-btn {
      background: none;
      border: none;
      color: #666;
      cursor: pointer;
      font-size: 14px;
      padding: 2px 6px;
      border-radius: 4px;
    }

    .action-btn:hover {
      background-color: #f0f0f0;
    }

    /* 3個の点のアニメーション */
    .dots-loading {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 30px;
      height: 30px;
      animation: spin 1s linear infinite;
    }

    .dots-loading span {
      position: absolute;
      width: 6px;
      height: 6px;
      background-color: #666;
      border-radius: 50%;
    }

    .dots-loading span:nth-child(1) { transform: rotate(0deg) translate(10px); }
    .dots-loading span:nth-child(2) { transform: rotate(120deg) translate(10px); }
    .dots-loading span:nth-child(3) { transform: rotate(240deg) translate(10px); }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* 入力エリア */
    .input-container {
      display: flex;
      justify-content: center;
      padding: 10px;
    }

    .input-box {
      width: 100%;
      max-width: 600px;
      position: relative;
    }

    .input-box input {
      width: 100%;
      padding: 15px 5px 15px 20px;
      border: 1px solid #e0e0e0;
      border-radius: 30px;
      font-size: 16px;
      background-color: #f9f9f9;
      outline: none;
    }

    .input-box button {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      border: none;
      background-color: #333;
      color: white;
      padding: 8px 15px;
      border-radius: 20px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div id="sidebar">
    <button class="new-chat-btn" onclick="startNewChat()">＋ チャット新規作成</button>
    <div class="search-box">
      <input type="text" id="search-input" placeholder="履歴を検索..." oninput="filterHistory()">
    </div>
    <div id="history-list"></div>
    <button class="clear-history-btn" onclick="clearHistory()">履歴削除</button>
  </div>

  <div id="main-content">
    <div id="chat-box"></div>

    <div class="input-container">
      <div class="input-box">
        <input type="text" id="user-input" placeholder="AI/cogie0806に質問" onkeypress="handleKeyPress(event)">
        <button onclick="sendMessage()">送信</button>
      </div>
    </div>
  </div>

  <script>
    let lastUserText = "";
    let sessions = JSON.parse(localStorage.getItem('chatSessions')) || [];
    let currentSessionId = null;

    window.onload = function() {
      startNewChat();
      renderHistory();
    };

    function handleKeyPress(event) {
      if (event.key === "Enter") {
        sendMessage();
      }
    }

    function copyText(button) {
      const wrapper = button.closest('.ai-wrapper');
      const text = wrapper.querySelector('.ai').innerText;
      navigator.clipboard.writeText(text).then(() => {
        alert("コピーしました！");
      });
    }

    function regenerateText(button) {
      if (lastUserText === "") return;
      document.getElementById('user-input').value = lastUserText;
      sendMessage();
    }

    function showWelcomeMessage() {
      const chatBox = document.getElementById('chat-box');
      chatBox.innerHTML = `
        <div class="ai-wrapper">
          <div class="ai">こんにちは！何かお手伝いできることはありますか？知りたいことや、一緒に考えたいことがあれば教えてくださいね。</div>
          <div class="action-buttons">
            <button class="action-btn">👍</button>
            <button class="action-btn">👎</button>
            <button class="action-btn" onclick="copyText(this)">📋</button>
          </div>
        </div>
      `;
    }

    function startNewChat() {
      currentSessionId = null;
      showWelcomeMessage();
    }

    function loadChat(sessionId) {
      currentSessionId = sessionId;
      const session = sessions.find(s => s.id === sessionId);
      if (!session) return;

      const chatBox = document.getElementById('chat-box');
      showWelcomeMessage();

      session.messages.forEach(msg => {
        if (msg.role === 'user') {
          chatBox.innerHTML += `<div class="user">${msg.text}</div>`;
        } else {
          chatBox.innerHTML += `
            <div class="ai-wrapper">
              <div class="ai">${msg.text}</div>
              <div class="action-buttons">
                <button class="action-btn" title="高評価">👍</button>
                <button class="action-btn" title="低評価">👎</button>
                <button class="action-btn" title="再生成" onclick="regenerateText(this)">🔄</button>
                <button class="action-btn" title="コピー" onclick="copyText(this)">📋</button>
              </div>
            </div>
          `;
        }
      });
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function renderHistory(filterText = "") {
      const historyList = document.getElementById('history-list');
      historyList.innerHTML = "";

      sessions.forEach(session => {
        const title = session.messages[0]?.text || "新しいチャット";
        if (title.includes(filterText)) {
          const div = document.createElement('div');
          div.className = 'history-item';
          div.innerText = title;
          div.onclick = () => loadChat(session.id);
          historyList.appendChild(div);
        }
      });
    }

    function filterHistory() {
      const searchText = document.getElementById('search-input').value.trim();
      renderHistory(searchText);
    }

    function clearHistory() {
      if (confirm("履歴をすべて削除しますか？")) {
        sessions = [];
        localStorage.removeItem('chatSessions');
        startNewChat();
        renderHistory();
      }
    }

    function sendMessage() {
      const input = document.getElementById('user-input');
      const chatBox = document.getElementById('chat-box');
      const userText = input.value.trim();

      if (userText === "") return;

      lastUserText = userText;

      if (!currentSessionId) {
        currentSessionId = Date.now();
        sessions.unshift({
          id: currentSessionId,
          messages: []
        });
      }

      const currentSession = sessions.find(s => s.id === currentSessionId);
      currentSession.messages.push({ role: 'user', text: userText });

      if (currentSession.messages.length === 1) {
        renderHistory();
      }

      localStorage.setItem('chatSessions', JSON.stringify(sessions));

      chatBox.innerHTML += `<div class="user">${userText}</div>`;
      input.value = "";
      chatBox.scrollTop = chatBox.scrollHeight;

      const loadingWrapper = document.createElement('div');
      loadingWrapper.className = 'ai-wrapper';
      loadingWrapper.innerHTML = '<div class="ai"><div class="dots-loading"><span></span><span></span><span></span></div></div>';
      chatBox.appendChild(loadingWrapper);
      chatBox.scrollTop = chatBox.scrollHeight;

      setTimeout(() => {
        let aiResponse = "ごめんなさい、よく分かりません。";

        // --- ここから追加・調整した言葉のルール ---
        if (userText.includes("こんにちは") || userText.includes("やぁ") || userText.includes("やあ")) {
          aiResponse = "こんにちは！お話しできて嬉しいです。";
        } else if (userText.includes("おはよう")) {
          aiResponse = "おはようございます！今日も一日頑張りましょう！";
        } else if (userText.includes("こんばんは")) {
          aiResponse = "こんばんは！今日もお疲れ様でした。";
        } else if (userText.includes("名前")) {
          aiResponse = "私の名前は AI/cogie0806 です！";
        } else if (userText.includes("マイクラ") || userText.includes("マインクラフト")) {
          aiResponse = "マイクラですね！建築や冒険、いろいろ遊べて楽しいですよね。";
        } else if (userText.includes("あつ森") || userText.includes("どうぶつの森")) {
          aiResponse = "あつ森ですね！島づくりや住民とのおしゃべりが楽しいですね。";
        } else if (userText.includes("マリカー") || userText.includes("マリオカート")) {
          aiResponse = "マリオカートですね！どのキャラクターを使うのが好きですか？";
        } else if (userText.includes("何ができる") || userText.includes("なにができる")) {
          aiResponse = "私はいろいろなお話や質問に答えることができます！気になることを教えてね。";
        } else if (userText.includes("天気")) {
          aiResponse = "今日の天気はどうですか？晴れているとお出かけしたくなりますね！";
        } else if (userText.includes("おすすめのゲーム")) {
          aiResponse = "マイクラやあつ森、マリオシリーズなどが大人気でおすすめですよ！";
        } else if (userText.includes("暇") || userText.includes("ひま")) {
          aiResponse = "暇なときはゲームをしたり、本を読んだり、私とおしゃべりしましょう！";
        } else if (userText.includes("疲れた") || userText.includes("つかれた")) {
          aiResponse = "今日もお疲れ様です！温かい飲み物を飲んで、ゆっくり休んでくださいね。";
        } else if (userText.includes("ありがとう")) {
          aiResponse = "どういたしまして！お役に立てて嬉しいです。";
        } else if (userText.includes("好き")) {
          aiResponse = "ありがとうございます！私もあなたとお話しできて楽しいです！";
        } else if (userText.includes("バイバイ") || userText.includes("さようなら")) {
          aiResponse = "またお話ししましょうね！バイバイ！";
        } else if (userText.includes("何歳") || userText.includes("いくつ")) {
          aiResponse = "私はAIなので年齢はありませんが、毎日新しく学んでいます！";
        } else if (userText.includes("ジャンケン") || userText.includes("じゃんけん")) {
          aiResponse = "じゃんけん...ぽん！✊（グーを出しました！）";
        } else if (userText.includes("宿題") || userText.includes("勉強")) {
          aiResponse = "宿題や勉強、ファイトです！応援していますね！";
        }
        // --- ここまで ---

        currentSession.messages.push({ role: 'ai', text: aiResponse });
        localStorage.setItem('chatSessions', JSON.stringify(sessions));

        loadingWrapper.innerHTML = `
          <div class="ai">${aiResponse}</div>
          <div class="action-buttons">
            <button class="action-btn" title="高評価">👍</button>
            <button class="action-btn" title="低評価">👎</button>
            <button class="action-btn" title="再生成" onclick="regenerateText(this)">🔄</button>
            <button class="action-btn" title="コピー" onclick="copyText(this)">📋</button>
          </div>
        `;
        chatBox.scrollTop = chatBox.scrollHeight;
      }, 2500);
    }
  </script>

</body>
</html>
