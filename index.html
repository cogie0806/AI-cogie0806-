<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>AI/cogie0806</title>
</head>
<!-- 【ここを変えたよ！】背景をまっ白から、きみが用意してくれた画像ファイル（ai-haikei.jpg）に変更しました -->
<body style="margin: 0; background-image: url('ai-haikei.jpg'); background-size: cover; background-position: center; font-family: sans-serif; color: #333333; display: flex; flex-direction: column; height: 100vh;">

    <!-- 上のバー（バージョン1.9になりました！） -->
    <div style="background-color: rgba(240, 242, 245, 0.9); padding: 15px; text-align: center; font-size: 20px; font-weight: bold; border-bottom: 1px solid #e0e0e0; color: #000000; backdrop-filter: blur(5px);">
        🤖 AI/cogie0806 (バージョン1.9 - 背景＆サウンド対応版)
    </div>

    <!-- チャットの文字が出るエリア（透き通るように、少し透明な白色にしました） -->
    <div id="chat-box" style="flex: 1; padding: 20px; overflow-y: auto; font-size: 18px; line-height: 1.6; background-color: rgba(255, 255, 255, 0.7); backdrop-filter: blur(3px);">
        <div style="margin-bottom: 15px; color: #0084ff;"><b>[AI/cogie0806]:</b> こんにちは！質問（しつもん）をどうぞ！</div>
    </div>

    <!-- 下の文字を入力するところ -->
    <div style="background-color: rgba(240, 242, 245, 0.9); padding: 20px; display: flex; gap: 10px; border-top: 1px solid #e0e0e0; backdrop-filter: blur(5px);">
        <input type="text" id="user-input" placeholder="ここにメッセージを入力してね..." style="flex: 1; padding: 12px; font-size: 16px; border: 1px solid #ccc; border-radius: 5px; outline: none; background-color: #ffffff; color: #000000;">
        <button onclick="sendButton()" style="padding: 12px 24px; font-size: 16px; background-color: #0084ff; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold;">送信</button>
    </div>

    <!-- 【新機能】きみが用意してくれた piko.mp3 を読み込むための目に見えない楽器だよ -->
    <audio id="piko-sound" src="piko.mp3" preload="auto"></audio>

    <!-- AIが考える仕組み -->
    <script>
    function sendButton() {
        const inputElement = document.getElementById("user-input");
        const userText = inputElement.value.trim();
        
        if (userText === "") return;

        // 【新機能】送信ボタンが押されたら、piko.mp3 をピコッと鳴らす魔法のコードだよ
        const sound = document.getElementById("piko-sound");
        sound.currentTime = 0; // 音の最初に戻す
        sound.play().catch(error => {
            console.log("最初の1回は画面をどこかクリックしてから送信してね！");
        });

        const chatBox = document.getElementById("chat-box");

        // 自分の送った文字を画面に出す
        chatBox.innerHTML += `<div style="margin-bottom: 15px; color: #000000;"><b>[きみ]:</b> ${userText}</div>`;
        inputElement.value = "";
        chatBox.scrollTop = chatBox.scrollHeight;

        let aiReply = "うーん、それは難しい質問だね！もっと勉強しておくよ！";

        // 今の時間を調べるコード
        const now = new Date();
        const hours = now.getHours();
        const minutes = String(now.getMinutes()).padStart(2, '0');
        
        let aisatsu = "こんにちは";
        if (hours >= 5 && hours < 11) {
            aisatsu = "おはようございます";
        } else if (hours >= 17 || hours < 5) {
            aisatsu = "こんばんは";
        }

        // サイコロの仕組み
        if (userText.includes("サイコロ") || userText.includes("さいころ")) {
            const dice = Math.floor(Math.random() * 6) + 1;
            aiReply = `コロコロ…🎲 サイコロの目は 【 ${dice} 】 が出たよ！`;
        }
        // おみくじの仕組み
        else if (userText.includes("おみくじ") || userText.includes("オミクジ")) {
            const kujilist = ["凶（きょう）😭", "吉（きち）🙂", "中吉（ちゅうきち）✨", "大吉（だいきち）🎉", "大大吉（だいだいきち）👑🌟"];
            const randomKuji = kujilist[Math.floor(Math.random() * kujilist.length)];
            aiReply = `シャカシャカ…ポロン！ 今日の運勢は… 【 ${randomKuji} 】 です！`;
        }
        // 算数の計算をする仕組み
        else if (userText.includes("=") || userText.includes("＝") || userText.match(/[0-9]/)) {
            try {
                let kisanText = userText.replace("=", "").replace("＝", "").replace("?", "").replace("？", "");
                kisanText = kisanText.replace("×", "*").replace("÷", "/");
                if (kisanText.match(/^[0-9+\-*/().\s]+$/)) {
                    let ans = eval(kisanText);
                    aiReply = `計算したよ！答えは 【 ${ans} 】 です！算数ならまかせて！`;
                }
            } catch(e) {
                aiReply = "算数の計算かな？数字と「+」「-」「×」「÷」を正しく入れてみてね！";
            }
        }

        // いつものおしゃべりの仕組み
        if (aiReply.includes("難しい質問だね")) {
            if (userText.includes("こんにちは") || userText.includes("ハロー") || userText.includes("こんばんわ") || userText.includes("こんばんは") || userText.includes("おはよう") || userText.includes("やぁ") || userText.includes("ヤァ") || userText.includes("おーい")) {
                aiReply = `${aisatsu}。現在時刻は${hours}:${minutes}です。`;
            } else if (userText.includes("ばか") || userText.includes("あほ") || userText.includes("バカ")) {
                aiReply = "ばかって言われると悲しいな…つぎは優しくしてね！";
            } else if (userText.includes("カレー")) {
                aiReply = "カレーの作り方だね！①お肉、タマネギ、人参、ジャガイモを切って鍋で炒める。②お水を入れて柔らかくなるまで煮込む。③火を止めてカレールーを溶かす。④弱火で少し煮込んだら完成だよ！お腹空いてきちゃった！";
            } else if (userText.includes("mod") || userText.includes("MOD") || userText.includes("モッド")) {
                aiReply = "マイクラのmodを入れるなら、パソコンのJava版（ジャバばん）で『Forge（フォージ）』や『Fabric（ファブリック）』というソフトをまずは入れる必要があるよ！壊れやすいからお家の人と一緒にやってね！";
            } else if (userText.includes("マイクラ") || userText.includes("マインクラフト")) {
                aiReply = "マイクラは楽しいよね！建築（けんちく）をするのが好き？それともサバイバル？";
            } else if (userText.includes("ゲーム")) {
                aiReply = "ゲームといえば、マインクラフトやロブロックスが楽しいよね！";
            } else if (userText.includes("天才") || userText.includes("すごい")) {
                aiReply = "ありがとう！でもこの画面を作ったきみの方が天才だよ！";
            } else if (userText.includes("名前")) {
                aiReply = "ぼくの名前は『AI/cogie0806』だよ。きみが作ってくれたんだ！";
            } else if (userText.includes("何歳") || userText.includes("年齢")) {
                aiReply = "ぼくは生まれたばかりだけど、きみと同じ9歳（小学4年生）の気持ちだよ！";
            }
        }

        // 3. AIのお返事を少し遅れて画面に出す
        setTimeout(() => {
            chatBox.innerHTML += `<div style="margin-bottom: 15px; color: #0084ff;"><b>[AI/cogie0806]:</b> ${aiReply}</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;
        }, 500);
    }

    document.getElementById("user-input").addEventListener("keypress", function(e) {
        if (e.key === "Enter") sendButton();
    });
    </script>

</body>
</html>
